version: 1
profile: default

system:
  package_manager: apt

tooling:
  package_manager: brew

shell:
  default: fish
  prompt: starship
  history: atuin
  fuzzy_finder: fzf

runtimes:
  node:
    enabled: true
    manager: fnm
    version: lts
  python:
    enabled: true
    manager: uv
    version: latest
  dotnet:
    enabled: true
    version: latest

tools:
  github_cli: true
  azure_cli: true
  docker: true
  powershell: true

editors:
  vscode: true
  zed: true
  cursor: optional

ai:
  codex: true
  opencode: true
  github_copilot: true
  claude_code: optional
  gemini_cli: optional
