version: 1
profile: frontend

system:
  package_manager: apt

tooling:
  package_manager: brew

shell:
  default: fish
  prompt: starship
  history: atuin
  fuzzy_finder: fzf

runtimes:
  node:
    enabled: true
    manager: fnm
    version: lts
  python:
    enabled: true
    manager: uv
    version: latest
  dotnet:
    enabled: false

tools:
  git: true
  github_cli: true
  docker: true

editors:
  vscode: true
  zed: true
  cursor: true

ai:
  codex: true
  opencode: true
  github_copilot: true
  claude_code: optional
  gemini_cli: optional

reproducibility:
  devbox: optional
  nix: optional
