version: 1
profile: ai

system:
  package_manager: apt

tooling:
  package_manager: brew

shell:
  default: fish
  prompt: starship
  history: atuin
  fuzzy_finder: fzf

runtimes:
  node:
    enabled: true
    manager: fnm
    version: lts
  python:
    enabled: true
    manager: uv
    version: latest
  dotnet:
    enabled: false

tools:
  github_cli: true
  azure_cli: true
  docker: true

editors:
  vscode: true
  zed: true
  cursor: optional

ai_tools:
  codex: true
  opencode: true
  copilot: true
  claude: true
  gemini: true
ai_apps:
  codex: true
  claude: true
  copilot: true
