name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: [1.23.x]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: latest

      - name: Build
        run: go build -o bin/dk ./cmd/dk/

      - name: Test
        run: go test ./...

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dk-${{ runner.os }}
          path: bin/dk
