name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: true

      - name: Build all platforms
        run: |
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os=${target%%-*}
            arch=${target#*-}
            GOOS=$os GOARCH=$arch go build \
              -ldflags="-X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }}" \
              -o dk-$target ./cmd/dk/
            sha256sum dk-$target > dk-$target.sha256
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Datakraften ${{ github.ref_name }}
          body_path: .github/release-template.md
          files: |
            dk-linux-amd64
            dk-linux-amd64.sha256
            dk-linux-arm64
            dk-linux-arm64.sha256
            dk-darwin-amd64
            dk-darwin-amd64.sha256
            dk-darwin-arm64
            dk-darwin-arm64.sha256
            install
